name: Debug sing-box
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.assets[] | select(.name|test("linux-amd64\\.tar\\.gz$")) | select(.name|test("legacy|musl|glibc")|not) | .browser_download_url' | head -1)
          curl -fsSL "$URL" -o sb.tgz && tar -xzf sb.tgz
          sudo install -m755 sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version | head -1
      - name: Real links start test
        run: |
          python3 - <<'PY'
          import sys, json
          sys.path.insert(0, "scripts")
          import speedtest as s
          links = [l.strip() for l in open("sub/all.txt") if "://" in l][:300]
          outs = [(l, s.to_outbound(l)) for l in links]
          outs = [(l, o) for l, o in outs if o][:8]
          print("converted", len(outs))
          seen = set()
          for l, o in outs:
              p, err = s._start("sing-box", [o])
              if p:
                  print("START OK:", l[:30], o.get("type"), o.get("server")); p.terminate()
              else:
                  e = err.strip().splitlines()[-1][:300] if err.strip() else "(no stderr)"
                  print("START FAIL:", l[:30], o.get("type"), "|", e)
          print("sample outbound:", json.dumps(outs[0][1])[:400])
          PY
