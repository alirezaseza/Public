name: Debug sing-box
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.assets[] | select(.name|test("linux-amd64\\.tar\\.gz$")) | select(.name|test("legacy|musl|glibc")|not) | .browser_download_url' | head -1)
          curl -fsSL "$URL" -o sb.tgz && tar -xzf sb.tgz
          sudo install -m755 sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version | head -1
      - name: Real links latency test
        run: |
          python3 - <<'PY'
          import sys, json, time, subprocess, urllib.request
          sys.path.insert(0, "scripts")
          import speedtest as s
          links = [l.strip() for l in open("sub/all.txt") if "://" in l][:300]
          outs = [(l, s.to_outbound(l)) for l in links]
          outs = [(l, o) for l, o in outs if o][:12]
          p, err = s._start("sing-box", [o for _, o in outs])
          print("batch start:", "OK" if p else ("FAIL " + err[-300:]))
          for i, (l, o) in enumerate(outs):
              port = s.BASE_PORT + i
              t = time.time()
              try:
                  with s._opener(port).open(urllib.request.Request(s.LAT_URL), timeout=8) as r:
                      r.read(16)
                  res = "urllib OK %dms" % ((time.time() - t) * 1000)
              except Exception as e:
                  res = "urllib FAIL " + repr(e)[:120]
              c = subprocess.run(["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "-x", "http://127.0.0.1:%d" % port, "--max-time", "8", s.LAT_URL], capture_output=True, text=True)
              print("LAT", o["type"], o.get("server"), "|", res, "| curl", c.stdout or c.stderr[:60])
          if p: p.terminate()
          PY
