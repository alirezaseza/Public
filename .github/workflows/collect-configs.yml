name: Collect configs
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the busy :00/:30 marks
  workflow_dispatch: {}                   # manual "Run workflow" button
concurrency:
  group: collect-configs
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/collect_configs.py --channels channels.txt -o sub/all.txt --max-age 25
      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add sub
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update configs (last 25h)"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
